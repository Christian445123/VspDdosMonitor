name: Release

# Vollautomatisch: Jeder Push auf den Hauptbranch mit Aenderungen am Client baut den MSI-Installer, vergibt die naechste
# Versionsnummer (letzte Version + 1 im Patch-Teil), legt Tag und GitHub-Release an und haengt die MSI an.
# Installierte Clients finden das Release ueber den Update-Check und bieten "Jetzt aktualisieren" an.
# Eine bestimmte Version (z. B. 2.0.0) kann weiterhin per Tag erzwungen werden: git tag v2.0.0 && git push origin v2.0.0
on:
  push:
    branches: [master, main]
    paths:
      - "VspDdosMonitor/**"
      - ".github/workflows/release.yml"
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Version bestimmen
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $latest = git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | ForEach-Object { [version]($_.TrimStart('v')) } | Sort-Object -Descending | Select-Object -First 1
            if ($latest) { $v = '{0}.{1}.{2}' -f $latest.Major, $latest.Minor, ($latest.Build + 1) } else { $v = '1.0.0' }
          }
          Write-Host "Version: $v"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: MSI-Installer bauen
        shell: pwsh
        working-directory: VspDdosMonitor/installer
        run: .\build-installer.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Release veroeffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Version ${{ steps.ver.outputs.version }}
          files: VspDdosMonitor/installer/output/*.msi
          generate_release_notes: true
